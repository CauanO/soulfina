<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoulFina | Gestão de peças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { colors: { gold: { 50: '#FBF9F4', 500: '#C5A059', 600: '#A68446' }, dark: '#111' }, fontFamily: { serif: ['"Cormorant Garamond"', 'serif'], sans: ['Montserrat', 'sans-serif'] } } } }</script>
    <style>
        body {
            background: #FAFAFA;
            font-family: Montserrat, sans-serif;
            color: #111
        }

        .inp {
            width: 100%;
            border: 1px solid rgba(0, 0, 0, .15);
            background: #fff;
            padding: .65rem .8rem;
            font-size: .875rem;
            outline: none
        }

        .inp:focus {
            border-color: #C5A059
        }

        .lbl {
            display: block;
            font-size: .65rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            margin: 1.1rem 0 .4rem;
            color: #555
        }

        .chip {
            border: 1px solid rgba(0, 0, 0, .2);
            padding: .4rem .8rem;
            font-size: .75rem;
            background: #fff;
            white-space: nowrap
        }

        .chip.on {
            background: #111;
            color: #fff;
            border-color: #111
        }

        .sw {
            position: relative;
            width: 2.5rem;
            height: 1.5rem;
            background: #ccc;
            border-radius: 99px;
            transition: .2s;
            flex: none
        }

        .sw::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 50%;
            background: #fff;
            transition: .2s
        }

        .sw.on {
            background: #C5A059
        }

        .sw.on::after {
            left: 1.125rem
        }

        .stat b {
            font-family: "Cormorant Garamond", serif;
            font-size: 2rem;
            line-height: 1;
            color: #C5A059
        }
    </style>
</head>

<body>

    <header class="bg-white border-b border-black/10 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-5 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="font-serif text-2xl tracking-widest uppercase">Soul<span
                        class="italic text-gold-500">Fina</span></a>
                <span class="text-[10px] uppercase tracking-[.25em] text-gray-400 hidden sm:block">Gestão de
                    peças</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="mode"
                    class="hidden sm:block text-[10px] uppercase tracking-widest px-2 py-1 bg-gold-50 border border-gold-500/40 text-gold-600"></span>
                <a href="index.html" target="_blank"
                    class="hidden sm:block text-xs uppercase tracking-[.2em] hover:text-gold-500">Ver loja</a>
                <button onclick="openForm()"
                    class="bg-dark text-white px-5 py-2.5 text-xs uppercase tracking-[.2em] hover:bg-gold-500 transition">+
                    Nova peça</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-5 py-8">
        <!-- Resumo -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="stat bg-white border border-black/10 p-4"><b id="s_total">0</b>
                <p class="text-[10px] uppercase tracking-widest mt-1 text-gray-500">Peças</p>
            </div>
            <div class="stat bg-white border border-black/10 p-4"><b id="s_vis">0</b>
                <p class="text-[10px] uppercase tracking-widest mt-1 text-gray-500">Visíveis na loja</p>
            </div>
            <div class="stat bg-white border border-black/10 p-4"><b id="s_units">0</b>
                <p class="text-[10px] uppercase tracking-widest mt-1 text-gray-500">Unidades em estoque</p>
            </div>
            <div class="stat bg-white border border-black/10 p-4"><b id="s_out" class="!text-red-500">0</b>
                <p class="text-[10px] uppercase tracking-widest mt-1 text-gray-500">Esgotadas</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="flex flex-col md:flex-row gap-3 md:items-center justify-between mb-5">
            <div id="filters" class="flex gap-2 overflow-x-auto"></div>
            <input id="search" oninput="q=this.value;draw()" placeholder="Buscar por nome ou categoria..."
                class="inp md:w-72">
        </div>
        <div id="rows" class="space-y-3"></div>
    </main>

    <!-- Formulário (gaveta) -->
    <div id="ov" onclick="closeForm()" class="fixed inset-0 bg-black/50 z-40 hidden"></div>
    <aside id="drawer"
        class="fixed top-0 right-0 h-full w-full max-w-xl bg-white z-50 translate-x-full transition-transform duration-300 flex flex-col">
        <div class="flex items-center justify-between px-6 py-5 border-b border-black/10">
            <h2 id="ftitle" class="font-serif text-3xl"></h2>
            <button onclick="closeForm()" class="text-2xl leading-none" aria-label="Fechar">×</button>
        </div>

        <div class="flex-1 overflow-y-auto px-6 pb-8">
            <label class="lbl">Nome da peça *</label>
            <input id="f_name" class="inp" placeholder="Ex.: Vestido Couro Assimétrico">

            <div class="grid grid-cols-2 gap-4">
                <div><label class="lbl">Categoria</label>
                    <input id="f_category" list="cats" class="inp" placeholder="Vestidos"><datalist
                        id="cats"></datalist>
                </div>
                <div><label class="lbl">Selo (opcional)</label>
                    <input id="f_tag" class="inp" placeholder="Novo, -15%...">
                </div>
                <div><label class="lbl">Preço (R$) *</label>
                    <input id="f_price" type="number" step="0.01" min="0" class="inp" placeholder="389.90">
                </div>
                <div><label class="lbl">Preço antigo (R$)</label>
                    <input id="f_oldPrice" type="number" step="0.01" min="0" class="inp" placeholder="459.90">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 items-end">
                <div><label class="lbl">Destaque na vitrine</label>
                    <select id="f_featured" class="inp">
                        <option value="0">0 – normal</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5 – topo da lista</option>
                    </select>
                </div>
                <label class="flex items-center gap-3 cursor-pointer pb-2.5">
                    <input id="f_active" type="checkbox" class="hidden"
                        onchange="this.nextElementSibling.classList.toggle('on',this.checked)">
                    <span class="sw on"></span><span class="text-xs">Visível na loja</span>
                </label>
            </div>

            <label class="lbl">Descrição</label>
            <textarea id="f_description" rows="3" class="inp" placeholder="Modelagem, tecido, detalhes..."></textarea>

            <label class="lbl">Fotos <span class="normal-case tracking-normal text-gray-400">(a primeira é a
                    capa)</span></label>
            <div id="imgs" class="grid grid-cols-4 gap-3 mb-3"></div>
            <div class="flex gap-2">
                <label class="chip cursor-pointer hover:border-gold-500 flex items-center">+ Enviar fotos
                    <input id="f_file" type="file" accept="image/*" multiple class="hidden"
                        onchange="addFiles(this.files);this.value=''"></label>
                <input id="f_url" class="inp" placeholder="ou cole o link de uma imagem"
                    onkeydown="if(event.key=='Enter'){event.preventDefault();addUrl()}">
                <button type="button" onclick="addUrl()" class="chip hover:border-gold-500">Adicionar</button>
            </div>

            <label class="lbl">Cores</label>
            <div id="colors" class="space-y-2"></div>
            <div id="presets" class="flex flex-wrap gap-2 mt-3 items-center"></div>
            <button type="button" onclick="addColor()" class="chip mt-3 hover:border-gold-500">+ Outra cor</button>

            <label class="lbl">Tamanhos</label>
            <div id="sizes" class="flex flex-wrap gap-2"></div>
            <div class="flex gap-2 mt-3">
                <input id="f_size" class="inp !w-40" placeholder="Outro (ex.: 46)"
                    onkeydown="if(event.key=='Enter'){event.preventDefault();addSize()}">
                <button type="button" onclick="addSize()" class="chip hover:border-gold-500">Adicionar</button>
            </div>

            <label class="lbl">Estoque <span id="stockTotal"
                    class="normal-case tracking-normal text-gray-400"></span></label>
            <div id="stock" class="grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
        </div>

        <div class="border-t border-black/10 p-5 flex gap-3">
            <button onclick="closeForm()"
                class="px-6 py-3 border border-black/20 text-xs uppercase tracking-[.2em]">Cancelar</button>
            <button id="saveBtn" onclick="save()"
                class="flex-1 bg-dark text-white py-3 text-xs uppercase tracking-[.2em] hover:bg-gold-500 transition disabled:opacity-50">Salvar
                peça</button>
        </div>
    </aside>

    <div id="toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-dark text-white text-xs tracking-wider px-6 py-3 z-[60] opacity-0 pointer-events-none transition-opacity">
    </div>

    <script>
        /* ============ CONFIG ============
           API_URL vazio  -> modo LOCAL (dados no navegador, só para testar a tela)
           API_URL '/api' -> usa o backend Flask                                    */
        const CONFIG = { API_URL: '', LOW_STOCK: 2 };

        /* ============ API (único ponto que fala com o servidor) ============
           GET    /api/products?all=1   lista todas (inclusive ocultas)
           POST   /api/products         cria      -> devolve a peça com id
           PUT    /api/products/<id>    edita
           DELETE /api/products/<id>    exclui
           POST   /api/upload           multipart 'file' -> { "url": "..." }

           Formato da peça:
           { id, name, category, price, oldPrice, tag, featured, active, description,
             images: ['url'], colors: [{name, hex}], sizes: ['P','M'], stock: { 'P': 3, 'M': 0 } }
           Sem tamanhos, o estoque fica em stock['Único'].                              */
        const KEY = 'sf_products_admin';
        const local = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null } catch (e) { return null } };
        const store = l => { try { localStorage.setItem(KEY, JSON.stringify(l)) } catch (e) { throw new Error('Armazenamento do navegador cheio (fotos muito grandes?)') } };
        const SEED = [
            { id: 'p1', name: 'Vestido Couro Assimétrico', category: 'Vestidos', price: 389.9, oldPrice: 459.9, tag: 'Novo', featured: 5, active: true, images: [], colors: [{ name: 'Preto', hex: '#111111' }, { name: 'Dourado', hex: '#C5A059' }], sizes: ['P', 'M', 'G'], stock: { P: 2, M: 4, G: 1 }, description: 'Modelagem assimétrica em couro ecológico, com cinto de fivela dourada.' },
            { id: 'p2', name: 'Vestido Poá Babados', category: 'Vestidos', price: 329.9, oldPrice: null, tag: '', featured: 4, active: true, images: [], colors: [{ name: 'Off white', hex: '#F1EBDD' }], sizes: ['P', 'M', 'G', 'GG'], stock: { P: 3, M: 3, G: 2, GG: 0 }, description: 'Tule delicado em poá com saia em camadas e mangas longas.' },
            { id: 'p3', name: 'Conjunto Halter Off White', category: 'Conjuntos', price: 499.9, oldPrice: 589.9, tag: '-15%', featured: 5, active: true, images: [], colors: [{ name: 'Off white', hex: '#E9E0CC' }], sizes: ['P', 'M', 'G'], stock: { P: 0, M: 0, G: 0 }, description: 'Colete halter com cinto duplo e bermuda de alfaiataria.' }
        ];
        const json = async r => { if (!r.ok) throw new Error((await r.text()) || r.status); return r.status == 204 ? null : r.json() };
        const Api = {
            async list() {
                if (CONFIG.API_URL) return json(await fetch(CONFIG.API_URL + '/products?all=1'));
                return local() || (store(SEED), SEED);
            },
            async save(p) {
                if (CONFIG.API_URL) return json(await fetch(CONFIG.API_URL + '/products' + (p.id ? '/' + p.id : ''), {
                    method: p.id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p)
                }));
                const all = local() || [];
                if (p.id) { const i = all.findIndex(x => x.id == p.id); i >= 0 ? all[i] = p : all.push(p) }
                else { p.id = 'p' + Date.now(); all.push(p) }
                store(all); return p;
            },
            async remove(id) {
                if (CONFIG.API_URL) return json(await fetch(CONFIG.API_URL + '/products/' + id, { method: 'DELETE' }));
                store((local() || []).filter(x => x.id != id));
            },
            async upload(file) {
                if (CONFIG.API_URL) {
                    const fd = new FormData(); fd.append('file', file);
                    return (await json(await fetch(CONFIG.API_URL + '/upload', { method: 'POST', body: fd }))).url
                }
                return shrink(file); // modo local: reduz e guarda como data:URI
            }
        };
        function shrink(file, max = 900) {
            return new Promise((ok, no) => {
                const img = new Image(), url = URL.createObjectURL(file);
                img.onload = () => {
                    const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
                    c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .82))
                };
                img.onerror = no; img.src = url;
            });
        }

        /* ============ INTERFACE ============ */
        const $ = id => document.getElementById(id);
        const R = v => 'R$ ' + Number(v).toFixed(2).replace('.', ',');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        const SIZES = ['PP', 'P', 'M', 'G', 'GG', '36', '38', '40', '42', '44', 'Único'];
        const PRESETS = [['Preto', '#111111'], ['Branco', '#FFFFFF'], ['Off white', '#E9E0CC'], ['Dourado', '#C5A059'], ['Caramelo', '#7A6A4A'], ['Vermelho', '#B3202E'], ['Azul marinho', '#1B2A49'], ['Rosa', '#E7A9B8']];
        const FILTERS = [['all', 'Todas'], ['on', 'Visíveis'], ['off', 'Ocultas'], ['low', 'Estoque baixo'], ['out', 'Esgotadas']];
        let list = [], f = null, q = '', flt = 'all', dirty = false;

        /* estoque */
        const stockKeys = p => (p.sizes && p.sizes.length) ? p.sizes : ['Único'];
        const hasStock = p => p.stock && typeof p.stock == 'object';
        const totalStock = p => hasStock(p) ? stockKeys(p).reduce((s, k) => s + (+p.stock[k] || 0), 0) : null;
        function stockBadge(p) {
            const t = totalStock(p);
            if (t === null) return '<span class="text-[10px] uppercase tracking-widest text-gray-400">estoque não informado</span>';
            if (t == 0) return '<span class="text-[10px] uppercase tracking-widest bg-red-50 text-red-600 border border-red-200 px-1.5 py-0.5">Esgotada</span>';
            const zeros = stockKeys(p).filter(k => !(+p.stock[k] > 0));
            const low = t <= CONFIG.LOW_STOCK;
            return `<span class="text-[11px] ${low ? 'text-amber-600 font-medium' : 'text-gray-600'}">${t} un.</span>` +
                (zeros.length ? ` <span class="text-[10px] text-red-500">sem ${esc(zeros.join(', '))}</span>` : '');
        }

        $('mode').textContent = CONFIG.API_URL ? 'Servidor' : 'Modo local (teste)';
        function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity = 0, 2400) }

        async function load() {
            $('rows').innerHTML = Array(3).fill('<div class="h-[104px] bg-white border border-black/10 animate-pulse"></div>').join('');
            try { list = await Api.list() }
            catch (e) { $('rows').innerHTML = '<p class="text-center py-16 text-gray-500">Não foi possível carregar as peças.<br><button onclick="load()" class="underline text-xs uppercase tracking-widest mt-3">Tentar novamente</button></p>'; return }
            draw();
        }

        function match(p) {
            const t = totalStock(p);
            return flt == 'all' ? true
                : flt == 'on' ? p.active !== false
                    : flt == 'off' ? p.active === false
                        : flt == 'out' ? t === 0
                            : flt == 'low' ? (t !== null && t > 0 && t <= CONFIG.LOW_STOCK) : true;
        }

        function draw() {
            const t = q.toLowerCase();
            const l = list.filter(p => (p.name + ' ' + p.category).toLowerCase().includes(t) && match(p))
                .sort((a, b) => (b.featured || 0) - (a.featured || 0));

            $('s_total').textContent = list.length;
            $('s_vis').textContent = list.filter(p => p.active !== false).length;
            $('s_units').textContent = list.reduce((s, p) => s + (totalStock(p) || 0), 0);
            $('s_out').textContent = list.filter(p => totalStock(p) === 0).length;

            $('filters').innerHTML = FILTERS.map(([k, n]) => `<button onclick="flt='${k}';draw()" class="chip ${flt == k ? 'on' : ''}">${n}</button>`).join('');
            $('cats').innerHTML = [...new Set(list.map(p => p.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('');

            $('rows').innerHTML = l.length ? l.map(p => `
  <div class="flex items-center gap-4 p-4 bg-white border border-black/10 ${p.active === false ? 'opacity-60' : ''}">
    <div class="w-14 h-[72px] bg-gray-100 shrink-0 overflow-hidden cursor-pointer" onclick="openForm('${esc(p.id)}')">${p.images?.[0] ? `<img src="${esc(p.images[0])}" class="w-full h-full object-cover object-top">` : '<div class="w-full h-full flex items-center justify-center text-gray-300 text-[10px] text-center">sem foto</div>'}</div>
    <div class="flex-1 min-w-0">
      <b class="font-serif text-xl block truncate">${esc(p.name)}</b>
      <p class="text-[11px] uppercase tracking-widest text-gray-400">${esc(p.category)} ${p.tag ? '• ' + esc(p.tag) : ''} <span class="sm:hidden normal-case tracking-normal text-gray-700">• ${R(p.price)}</span></p>
      <div class="flex flex-wrap items-center gap-1.5 mt-1.5">${(p.colors || []).map(c => `<i title="${esc(c.name)}" class="w-3.5 h-3.5 rounded-full border border-black/20" style="background:${esc(c.hex)}"></i>`).join('')}
        <span class="text-[11px] text-gray-500 ml-1">${esc((p.sizes || []).join(' · '))}</span>
        <span class="ml-2">${stockBadge(p)}</span></div>
    </div>
    <div class="text-right text-sm hidden sm:block"><b>${R(p.price)}</b>${p.oldPrice ? `<br><s class="text-xs text-gray-400">${R(p.oldPrice)}</s>` : ''}</div>
    <button onclick="toggle('${esc(p.id)}')" title="Visível na loja" class="sw ${p.active !== false ? 'on' : ''}"></button>
    <div class="flex flex-col sm:flex-row gap-2">
      <button onclick="openForm('${esc(p.id)}')" class="chip hover:border-gold-500">Editar</button>
      <button onclick="dup('${esc(p.id)}')" class="chip hover:border-gold-500 hidden md:block">Duplicar</button>
      <button onclick="del('${esc(p.id)}')" class="chip hover:border-red-500 hover:text-red-600">Excluir</button>
    </div>
  </div>`).join('') : '<p class="text-center py-16 text-gray-500">Nenhuma peça encontrada.</p>';
        }

        async function toggle(id) {
            const p = list.find(x => x.id == id); p.active = p.active === false;
            try { await Api.save(p); draw(); toast(p.active ? 'Peça visível na loja' : 'Peça oculta da loja') } catch (e) { toast('Erro ao atualizar'); load() }
        }
        async function del(id) {
            const p = list.find(x => x.id == id);
            if (!confirm(`Excluir "${p.name}"? Essa ação não pode ser desfeita.`)) return;
            try { await Api.remove(id); toast('Peça excluída'); load() } catch (e) { toast('Erro ao excluir') }
        }
        async function dup(id) {
            const p = JSON.parse(JSON.stringify(list.find(x => x.id == id)));
            p.id = ''; p.name += ' (cópia)'; p.active = false;
            try { await Api.save(p); toast('Cópia criada (oculta)'); load() } catch (e) { toast('Erro ao duplicar') }
        }

        /* --- formulário --- */
        function openForm(id) {
            f = id ? JSON.parse(JSON.stringify(list.find(x => x.id == id)))
                : { id: '', name: '', category: '', price: '', oldPrice: '', tag: '', featured: 0, active: true, description: '', images: [], colors: [], sizes: [], stock: {} };
            f.images ||= []; f.colors ||= []; f.sizes ||= []; f.stock ||= {};
            $('ftitle').textContent = id ? 'Editar peça' : 'Nova peça';
            ['name', 'category', 'price', 'tag', 'description'].forEach(k => $('f_' + k).value = f[k] ?? '');
            $('f_oldPrice').value = f.oldPrice ?? ''; $('f_featured').value = f.featured || 0;
            $('f_active').checked = f.active !== false; $('f_active').nextElementSibling.classList.toggle('on', f.active !== false);
            drawImgs(); drawColors(); drawSizes(); drawPresets(); drawStock();
            $('drawer').classList.remove('translate-x-full'); $('ov').classList.remove('hidden');
            dirty = false; setTimeout(() => $('f_name').focus(), 300);
        }
        function closeForm(force) {
            if (!force && dirty && !confirm('Descartar as alterações?')) return;
            $('drawer').classList.add('translate-x-full'); $('ov').classList.add('hidden'); dirty = false;
        }
        $('drawer').addEventListener('input', () => dirty = true);
        $('drawer').addEventListener('click', e => { if (e.target.closest('button[type=button], #imgs button')) dirty = true });

        /* fotos */
        function drawImgs() {
            $('imgs').innerHTML = f.images.map((u, i) => `
  <div class="relative aspect-[3/4] bg-gray-100 border ${i == 0 ? 'border-gold-500' : 'border-black/10'} group">
    <img src="${esc(u)}" class="w-full h-full object-cover object-top">
    ${i == 0 ? '<span class="absolute top-1 left-1 bg-gold-500 text-white text-[9px] uppercase tracking-widest px-1.5 py-0.5">Capa</span>' : ''}
    <div class="absolute bottom-0 inset-x-0 flex justify-between bg-black/60 text-white text-xs opacity-100 sm:opacity-0 group-hover:opacity-100 transition">
      <button onclick="moveImg(${i},-1)" class="px-2 py-1">←</button><button onclick="delImg(${i})" class="px-2 py-1">✕</button><button onclick="moveImg(${i},1)" class="px-2 py-1">→</button>
    </div></div>`).join('');
        }
        async function addFiles(files) {
            toast('Enviando fotos...');
            for (const file of files) { try { f.images.push(await Api.upload(file)) } catch (e) { toast('Falha ao enviar ' + file.name) } }
            dirty = true; drawImgs(); toast('Fotos adicionadas');
        }
        function addUrl() { const u = $('f_url').value.trim(); if (!u) return; f.images.push(u); $('f_url').value = ''; drawImgs() }
        function delImg(i) { f.images.splice(i, 1); drawImgs() }
        function moveImg(i, d) { const j = i + d; if (j < 0 || j >= f.images.length) return;[f.images[i], f.images[j]] = [f.images[j], f.images[i]]; drawImgs() }

        /* cores */
        function drawColors() {
            $('colors').innerHTML = f.colors.map((c, i) => `
  <div class="flex items-center gap-2">
    <input type="color" value="${esc(c.hex)}" oninput="f.colors[${i}].hex=this.value" class="w-10 h-10 border border-black/15 p-0.5 bg-white cursor-pointer">
    <input class="inp" value="${esc(c.name)}" placeholder="Nome da cor" oninput="f.colors[${i}].name=this.value">
    <button type="button" onclick="f.colors.splice(${i},1);drawColors()" class="chip hover:border-red-500">✕</button>
  </div>`).join('');
        }
        function drawPresets() {
            $('presets').innerHTML = '<span class="text-[10px] uppercase tracking-widest text-gray-400 mr-1">Atalhos:</span>' +
                PRESETS.map(([n, h]) => `<button type="button" title="${n}" onclick="addColor('${n}','${h}')" class="w-6 h-6 rounded-full border border-black/20" style="background:${h}"></button>`).join('');
        }
        function addColor(name = '', hex = '#C5A059') {
            if (name && f.colors.some(c => c.name == name)) return toast('Cor já adicionada');
            f.colors.push({ name, hex }); drawColors();
        }

        /* tamanhos */
        function drawSizes() {
            const all = [...SIZES, ...f.sizes.filter(s => !SIZES.includes(s))];
            $('sizes').innerHTML = all.map(s => `<button type="button" onclick="toggleSize(this.dataset.s)" data-s="${esc(s)}" class="chip ${f.sizes.includes(s) ? 'on' : ''}">${esc(s)}</button>`).join('');
        }
        function toggleSize(s) { f.sizes = f.sizes.includes(s) ? f.sizes.filter(x => x != s) : [...f.sizes, s]; drawSizes(); drawStock() }
        function addSize() { const s = $('f_size').value.trim(); if (!s) return; if (!f.sizes.includes(s)) f.sizes.push(s); $('f_size').value = ''; drawSizes(); drawStock() }

        /* estoque no formulário */
        function drawStock() {
            $('stock').innerHTML = stockKeys(f).map(s => `
  <label class="block"><span class="text-[11px] text-gray-500">${f.sizes.length ? 'Tam. ' + esc(s) : 'Quantidade'}</span>
    <input type="number" min="0" step="1" value="${+f.stock[s] || 0}" data-s="${esc(s)}" class="inp mt-1"
      oninput="f.stock[this.dataset.s]=Math.max(0,parseInt(this.value)||0);drawStockTotal()"></label>`).join('');
            drawStockTotal();
        }
        function drawStockTotal() { const t = totalStock(f); $('stockTotal').textContent = `— total: ${t} un.${t == 0 ? ' (aparecerá como esgotada)' : ''}` }

        /* salvar */
        async function save() {
            const name = $('f_name').value.trim(), price = parseFloat($('f_price').value), old = parseFloat($('f_oldPrice').value);
            if (!name) return toast('Informe o nome da peça');
            if (!(price > 0)) return toast('Informe um preço válido');
            if (old && old <= price) return toast('O preço antigo deve ser maior que o preço atual');
            const stock = {}; stockKeys(f).forEach(k => stock[k] = Math.max(0, parseInt(f.stock[k]) || 0));
            const p = {
                id: f.id, name, category: $('f_category').value.trim() || 'Outros', price, oldPrice: old || null,
                tag: $('f_tag').value.trim(), featured: +$('f_featured').value, active: $('f_active').checked,
                description: $('f_description').value.trim(), images: f.images,
                colors: f.colors.filter(c => c.name.trim()).map(c => ({ name: c.name.trim(), hex: c.hex })),
                sizes: f.sizes, stock
            };
            $('saveBtn').disabled = true;
            try { await Api.save(p); closeForm(true); toast(f.id ? 'Peça atualizada' : 'Peça criada'); load() }
            catch (e) { toast('Erro ao salvar: ' + e.message) }
            $('saveBtn').disabled = false;
        }

        document.addEventListener('keydown', e => {
            const open = !$('drawer').classList.contains('translate-x-full');
            if (e.key == 'Escape' && open) closeForm();
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() == 's' && open) { e.preventDefault(); save() }
        });
        window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = '' } });
        load();
    </script>
</body>

</html>
